<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!-- HelpBD AinSeba Admin live page --><title>HelpBD — AinSeba Admin</title><link rel="stylesheet" href="style.css"><style>body{background:#f3f7f5}.page{max-width:1100px;margin:auto;padding:35px 5%}.panel,.login{background:#fff;border:1px solid #e1ebe5;border-radius:18px;overflow:hidden}.login{max-width:500px;margin:70px auto;padding:28px}.item{padding:20px;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.meta{color:#6f7d77;font-size:13px;line-height:1.8}.msg{display:flex;flex-direction:column;gap:4px;margin-top:12px}.bubble{padding:11px 13px;border-radius:13px;max-width:75%;white-space:pre-wrap;line-height:1.55}.user{background:#e8f8f0;align-self:flex-end}.admin{background:#eef2f0;align-self:flex-start}.reply{display:flex;gap:8px;margin-top:12px}.reply input{flex:1;padding:11px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}.btn{border:0;background:#173a2f;color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.refresh{background:#129d63}.danger{background:#fdecee;color:#b23c49}.hidden{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid #e8eeeb;gap:10px}.toolbar-actions{display:flex;gap:8px;align-items:center}.notice{background:#fff8e9;border:1px solid #f1dfb4;padding:12px;border-radius:10px;color:#725f32;font-size:13px;line-height:1.6}.error{display:none;background:#fdecee;color:#b23c49;padding:12px;border-radius:10px;margin-top:12px}.show{display:block}@media(max-width:700px){.bubble{max-width:90%}.reply{flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%;justify-content:flex-end}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="admin-home.html">← Admin Home</a></header><main class="page"><section class="login" id="login"><div class="eyebrow">🛡️ Secure Admin</div><h1>আইনসেবা Admin</h1><p>নিবন্ধিত ব্যবহারকারীর message দেখুন, উত্তর দিন অথবা registration delete করুন।</p><input id="password" type="password" placeholder="Admin password"><button class="btn" id="loginBtn">Panel খুলুন</button><div id="err" class="error"></div></section><section id="app" class="hidden"><div class="toolbar"><div><div class="eyebrow">⚖️ AinSeba</div><h1>আইনসেবা Messages</h1></div><div class="toolbar-actions"><button class="btn refresh" id="refresh">🔄 Refresh</button><button class="btn danger" id="logout">Logout</button></div></div><div class="notice" style="margin:18px 0">আইনসেবা তথ্য সাধারণ সহায়তার জন্য। গুরুতর বা জরুরি আইনি বিষয়ে যোগ্য আইনজীবী/স্থানীয় কর্তৃপক্ষের সহায়তা নেওয়া উচিত।</div><div class="panel" id="list"></div></section></main><script>const $=id=>document.getElementById(id);let password='',rows=[];function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}async function api(options={}){const r=await fetch('/api/admin-legal',{...options,headers:{'Content-Type':'application/json','x-admin-password':password,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){if(!rows.length){$('list').innerHTML='<div class="item">কোনো আইনসেবা registration নেই।</div>';return}$('list').innerHTML=rows.map(r=>{const ms=r.messages||[];return `<article class="item"><div><strong>${esc(r.name)}</strong> <span style="margin-left:8px">${r.status==='active'?'🟢 Active':'⚪ Closed'}</span></div><div class="meta">📱 ${esc(r.phone)}<br>📍 ${esc([r.division,r.district,r.upazila,r.union_name].filter(Boolean).join(' / '))}<br>🕒 ${esc(r.created_at||'')}</div><div class="msg">${ms.length?ms.map(m=>`<div class="bubble ${m.sender==='admin'?'admin':'user'}"><b>${m.sender==='admin'?'Admin':'User'}</b><br>${esc(m.message)}</div>`).join(''):'<div class="meta">এখনো কোনো message নেই।</div>'}</div><form class="reply" onsubmit="reply(event,'${r.id}')"><input name="message" placeholder="Admin reply..." required><button class="btn">📨 Reply</button><button type="button" class="btn danger" onclick="removeReg('${r.id}')">🗑️ Delete</button></form></article>`}).join('')}async function load(){const d=await api();rows=d.registrations||[];render()}async function reply(e,id){e.preventDefault();const f=e.target,m=f.message.value.trim();try{await api({method:'POST',body:JSON.stringify({id,message:m})});f.reset();await load()}catch(err){alert(err.message)}}async function removeReg(id){if(!confirm('এই আইনসেবা registration এবং সব message স্থায়ীভাবে Delete করবেন?'))return;try{await api({method:'DELETE',body:JSON.stringify({id})});await load()}catch(err){alert(err.message)}}$('loginBtn').onclick=async()=>{password=$('password').value;if(!password){$('err').textContent='Admin password দিন।';$('err').classList.add('show');return}try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(err){password='';$('err').textContent=err.message;$('err').classList.add('show')}};$('refresh').onclick=async()=>{try{await load()}catch(err){alert(err.message)}};$('logout').onclick=()=>{password='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};</script></body></html>
