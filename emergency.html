<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>জরুরি সহায়তা — HelpBD</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1050px;margin:auto;padding:50px 5%}.hero{background:#102d24;color:#fff;border-radius:24px;padding:38px;margin-bottom:22px}.hero h1{font-size:42px;margin:8px 0}.card{background:#fff;border:1px solid #e1ebe5;border-radius:20px;padding:30px;margin-bottom:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;display:block;margin-bottom:15px}input,select,textarea{width:100%;margin-top:7px;padding:14px;border:1px solid #dbe6e0;border-radius:10px;font:inherit;background:#fff}textarea{min-height:120px}.btn{border:0;background:#129d63;color:#fff;padding:14px 22px;border-radius:11px;font:700 15px 'Hind Siliguri';cursor:pointer}.ok{display:none;margin-top:15px;padding:13px;border-radius:10px;background:#e8f8f0;color:#0a8751}.ok.show{display:block}@media(max-width:700px){.row{grid-template-columns:1fr}.hero h1{font-size:34px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="index.html">← Home</a></header><main class="page"><section class="hero"><div class="eyebrow">🚨 জরুরি সহায়তা</div><h1>জরুরি সাহায্য দ্রুত পৌঁছে দিতে চাই।</h1><p>রক্ত, চিকিৎসা, অ্যাম্বুলেন্স, খাবার বা আশ্রয়ের মতো জরুরি সাহায্যের আবেদন করুন। আবেদনটি সরাসরি Admin review queue-তে যাবে।</p></section><section class="card"><h2>জরুরি সহায়তার আবেদন</h2><form id="form"><div class="row"><label>আবেদনকারীর নাম<input id="name" required></label><label>মোবাইল নম্বর<input id="phone" required type="tel" pattern="01[0-9]{9}" maxlength="11" placeholder="017XXXXXXXX"></label></div><div class="row"><label>সহায়তার ধরন<select id="type" required><option value="">নির্বাচন করুন</option><option>জরুরি রক্ত</option><option>চিকিৎসা</option><option>অ্যাম্বুলেন্স</option><option>খাবার / আশ্রয়</option><option>অন্যান্য</option></select></label><label>জরুরিতার মাত্রা<select id="urgency"><option>অত্যন্ত জরুরি</option><option>জরুরি</option><option>সাধারণ</option></select></label></div><div class="row"><label>বিভাগ<select id="division" required></select></label><label>জেলা<select id="district" required disabled></select></label></div><div class="row"><label>উপজেলা<select id="upazila" required disabled></select></label><label>ইউনিয়ন<select id="union" required disabled></select></label></div><label>বিস্তারিত<textarea id="details" required placeholder="কী সাহায্য প্রয়োজন এবং কোথায় প্রয়োজন লিখুন..."></textarea></label><button class="btn" type="submit">আবেদন Admin-এর কাছে পাঠান →</button><div id="ok" class="ok"></div></form></section></main><script src="locations.js"></script><script>const KEY='helpbd_requests';const $=id=>document.getElementById(id);function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}$('form').addEventListener('submit',e=>{e.preventDefault();const loc={division:$('division').selectedOptions[0]?.textContent||'',district:$('district').selectedOptions[0]?.textContent||'',upazila:$('upazila').selectedOptions[0]?.textContent||'',union:$('union').selectedOptions[0]?.textContent||''};const list=data();list.push({id:Date.now(),service:'জরুরি সহায়তা',name:$('name').value.trim(),phone:$('phone').value.trim(),type:$('type').value,urgency:$('urgency').value,...loc,details:$('details').value.trim(),status:'pending',createdAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(list));$('ok').textContent='✅ আপনার জরুরি আবেদন Admin review-এর জন্য পাঠানো হয়েছে।';$('ok').classList.add('show');e.target.reset()});loadBDLocations();</script></body></html>
