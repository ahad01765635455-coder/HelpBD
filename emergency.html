<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency Help — HelpBD</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1000px;margin:auto;padding:55px 6%}.hero2{background:#102d24;color:#fff;border-radius:24px;padding:40px;margin-bottom:24px}.hero2 h1{font-size:42px;margin:8px 0}.card{background:#fff;border:1px solid #e0ebe5;border-radius:20px;padding:30px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;display:block;margin-bottom:16px}input,select,textarea{width:100%;margin-top:7px;padding:14px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}textarea{height:120px}.submit{border:0;cursor:pointer;font:700 15px 'Hind Siliguri'}@media(max-width:700px){.row{grid-template-columns:1fr}.hero2 h1{font-size:34px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="index.html">← Home</a></header><main class="page"><section class="hero2"><div class="eyebrow">🚨 জরুরি সহায়তা</div><h1>জরুরি সাহায্য দ্রুত পৌঁছে দিতে চাই।</h1><p>রক্ত, চিকিৎসা, অ্যাম্বুলেন্স বা অন্য জরুরি সহায়তার আবেদন এখানে করা যাবে। এখন Login বাধ্যতামূলক নয়।</p></section><section class="card"><div class="eyebrow">Emergency Request</div><h2>জরুরি সহায়তার আবেদন</h2><form onsubmit="event.preventDefault();alert('আপনার জরুরি আবেদনটি demo হিসেবে গ্রহণ করা হয়েছে।')"><div class="row"><label>সহায়তার ধরন<select required><option value="">নির্বাচন করুন</option><option>জরুরি রক্ত</option><option>চিকিৎসা</option><option>অ্যাম্বুলেন্স</option><option>খাবার / আশ্রয়</option><option>অন্যান্য</option></select></label><label>জরুরিতার মাত্রা<select required><option>অত্যন্ত জরুরি</option><option>জরুরি</option><option>সাধারণ</option></select></label></div><div class="row"><label>বিভাগ<select id="division" required></select></label><label>জেলা<select id="district" required disabled></select></label></div><div class="row"><label>উপজেলা<select id="upazila" required disabled></select></label><label>ইউনিয়ন<select id="union" required disabled></select></label></div><label>বিস্তারিত<textarea required placeholder="কী সাহায্য প্রয়োজন লিখুন..."></textarea></label><button class="primary submit" type="submit">আবেদন পাঠান →</button></form></section></main><script src="locations.js"></script><script>loadBDLocations();</script></body></html>
