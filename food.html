<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>খাদ্য ও প্রয়োজনীয় সামগ্রী — HelpBD</title><link rel="stylesheet" href="style.css"><style>.page{max-width:1000px;margin:auto;padding:50px 5%}.hero,.card{border-radius:22px}.hero{background:#102d24;color:#fff;padding:40px;margin-bottom:22px}.hero h1{font-size:40px}.heroimg{width:100%;height:260px;object-fit:cover;border-radius:18px;margin-top:20px}.credit{font-size:11px;color:#91a09a;margin-top:7px}.card{background:#fff;border:1px solid #e1ebe5;padding:30px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;display:block;margin-bottom:15px}input,select,textarea{width:100%;margin-top:7px;padding:14px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}textarea{min-height:120px}.btn{border:0;background:#129d63;color:#fff;padding:14px 22px;border-radius:11px;font-weight:700;cursor:pointer}.ok{display:none;margin-top:15px;background:#e8f8f0;color:#078551;padding:13px;border-radius:10px}.ok.show{display:block}@media(max-width:700px){.row{grid-template-columns:1fr}.hero h1{font-size:32px}.heroimg{height:220px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="index.html">← Home</a></header><main class="page"><section class="hero"><div class="eyebrow">🥘 খাদ্য ও প্রয়োজনীয় সামগ্রী</div><h1>একটি পরিবারের পাশে দাঁড়ান</h1><p>খাবার, পোশাক ও প্রয়োজনীয় সামগ্রী দিতে বা পেতে আবেদন করুন। আবেদনটি Admin যাচাই করবে।</p><img class="heroimg" src="https://bdrcs.org/wp-content/uploads/2024/09/Noakhali-17-1063x800.jpg" alt="বাংলাদেশে ত্রাণ সামগ্রী বিতরণ"><div class="credit">ছবি: Bangladesh Red Crescent Society-এর Noakhali relief distribution gallery.</div></section><section class="card"><h2>সহায়তার আবেদন</h2><form id="form"><div class="row"><label>নাম<input id="name" required></label><label>মোবাইল নম্বর<input id="phone" required type="tel" pattern="01[0-9]{9}" maxlength="11"></label></div><div class="row"><label>কী প্রয়োজন?<select id="need" required><option value="">নির্বাচন করুন</option><option>খাবার</option><option>পোশাক</option><option>শিশুর সামগ্রী</option><option>শীতবস্ত্র</option><option>অন্যান্য</option></select></label><label>পরিমাণ / পরিবার<input id="qty" placeholder="যেমন: ৫ জনের খাবার"></label></div><div class="row"><label>বিভাগ<select id="division" required></select></label><label>জেলা<select id="district" required disabled></select></label></div><div class="row"><label>উপজেলা<select id="upazila" required disabled></select></label><label>ইউনিয়ন<select id="union" required disabled></select></label></div><label>বিস্তারিত<textarea id="details" required placeholder="কীভাবে সাহায্য প্রয়োজন লিখুন..."></textarea></label><button class="btn" type="submit">Admin-এর কাছে আবেদন পাঠান →</button><div id="ok" class="ok"></div></form></section></main><script src="locations.js"></script><script>const $=id=>document.getElementById(id);const KEY='helpbd_requests';$('form').onsubmit=e=>{e.preventDefault();const list=JSON.parse(localStorage.getItem(KEY)||'[]');list.push({id:Date.now(),service:'খাদ্য ও প্রয়োজনীয় সামগ্রী',name:$('name').value.trim(),phone:$('phone').value.trim(),need:$('need').value,quantity:$('qty').value.trim(),division:$('division').selectedOptions[0]?.text||'',district:$('district').selectedOptions[0]?.text||'',upazila:$('upazila').selectedOptions[0]?.text||'',union:$('union').selectedOptions[0]?.text||'',details:$('details').value.trim(),status:'pending',createdAt:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(list));$('ok').textContent='✅ আবেদনটি Admin review-এর জন্য পাঠানো হয়েছে।';$('ok').classList.add('show');e.target.reset()};loadBDLocations();</script></body></html>
