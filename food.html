<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>খাদ্য ও প্রয়োজনীয় সামগ্রী — HelpBD</title><link rel="stylesheet" href="style.css"><style>body{background:#f4f8f6}.page{max-width:1050px;margin:auto;padding:42px 5%}.hero,.card{border-radius:22px}.hero{background:#102d24;color:#fff;padding:34px;margin-bottom:22px}.hero h1{font-size:40px;margin:8px 0}.heroimg{width:100%;height:250px;object-fit:cover;border-radius:18px;margin-top:18px}.card{background:#fff;border:1px solid #e1ebe5;padding:28px;margin-bottom:22px;box-shadow:0 12px 38px #174d3609}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;display:block;margin-bottom:14px}input,select,textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}textarea{min-height:120px}.btn{border:0;background:#129d63;color:#fff;padding:14px 20px;border-radius:11px;font-weight:700;cursor:pointer}.ok,.err{display:none;margin-top:14px;padding:13px;border-radius:10px}.ok{background:#e8f8f0;color:#087f4d}.err{background:#fdecee;color:#b23c49}.show{display:block}@media(max-width:700px){.row{grid-template-columns:1fr}.hero h1{font-size:32px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="index.html">← Home</a></header><main class="page"><section class="hero"><div class="eyebrow">🥘 খাদ্য ও প্রয়োজনীয় সামগ্রী</div><h1>একটি পরিবারের পাশে দাঁড়ান</h1><p>খাবার, পোশাক ও প্রয়োজনীয় সামগ্রীর আবেদন Admin যাচাই করবেন। অনুমোদিত হলে campaign প্রকাশ করা হবে।</p><img class="heroimg" src="https://bdrcs.org/wp-content/uploads/2024/09/Noakhali-17-1063x800.jpg" alt="বাংলাদেশে ত্রাণ বিতরণ"></section><section class="card"><h2>সহায়তার আবেদন</h2><form id="form"><div class="row"><label>নাম<input id="name" required></label><label>মোবাইল নম্বর<input id="phone" required maxlength="11" inputmode="numeric" placeholder="017XXXXXXXX"></label></div><div class="row"><label>কী প্রয়োজন?<select id="need" required><option value="">নির্বাচন করুন</option><option>খাবার</option><option>পোশাক</option><option>শিশুর সামগ্রী</option><option>শীতবস্ত্র</option><option>অন্যান্য</option></select></label><label>পরিমাণ / পরিবার<input id="qty" placeholder="যেমন: ৫ জনের খাবার"></label></div><div class="row"><label>বিভাগ<select id="division" required></select></label><label>জেলা<select id="district" required disabled></select></label></div><div class="row"><label>উপজেলা<select id="upazila" required disabled></select></label><label>ইউনিয়ন<select id="union" required disabled></select></label></div><label>বিস্তারিত<textarea id="details" required placeholder="কীভাবে সাহায্য প্রয়োজন লিখুন..."></textarea></label><button class="btn" type="submit">Admin-এর কাছে আবেদন পাঠান →</button><div id="ok" class="ok"></div><div id="err" class="err"></div></form></section></main><script src="locations.js"></script><script>loadBDLocations();const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();$('ok').classList.remove('show');$('err').classList.remove('show');const l={division:$('division').selectedOptions[0]?.text||'',district:$('district').selectedOptions[0]?.text||'',upazila:$('upazila').selectedOptions[0]?.text||'',union_name:$('union').selectedOptions[0]?.text||''};try{const r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:'খাদ্য ও প্রয়োজনীয় সামগ্রী',name:$('name').value.trim(),phone:$('phone').value.trim(),details:`প্রয়োজন: ${$('need').value}\nপরিমাণ/পরিবার: ${$('qty').value.trim()}\n${$('details').value.trim()}`,...l})});const d=await r.json();if(!r.ok)throw Error(d.error||'আবেদন পাঠানো যায়নি');$('ok').textContent='✅ আবেদনটি Admin-এর কাছে Pending হিসেবে পাঠানো হয়েছে।';$('ok').classList.add('show');e.target.reset()}catch(err){$('err').textContent='❌ '+err.message;$('err').classList.add('show')}};</script></body></html>
