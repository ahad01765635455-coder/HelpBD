<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelpBD — Help Request Review</title><link rel="stylesheet" href="style.css"><style>body{background:#f3f7f5}.page{max-width:1150px;margin:auto;padding:35px 5%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.panel{background:#fff;border:1px solid #e1ebe5;border-radius:18px;overflow:hidden;margin-bottom:18px}.item{padding:22px;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.meta{color:#697771;font-size:13px;line-height:1.9}.pill{display:inline-block;background:#e8f8f0;color:#078551;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.pending{background:#fff4da;color:#a36a00}.approved{background:#e8f8f0;color:#078551}.details{white-space:pre-wrap;background:#f7faf8;border:1px solid #e5eeea;border-radius:12px;padding:14px;margin-top:12px;line-height:1.7}.actions{margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#173a2f;color:#fff}.danger{background:#fdecee;color:#b23c49}.login{max-width:500px;margin:70px auto;background:#fff;padding:28px;border:1px solid #e1ebe5;border-radius:20px}.login input,.approvebox input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 12px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}.error{display:none;background:#fdecee;color:#b23c49;padding:12px;border-radius:10px;margin-top:12px}.show{display:block}.approvebox{display:none;background:#f7faf8;border:1px solid #e1ebe5;border-radius:14px;padding:16px;margin-top:15px}.approvebox.show{display:block}.muted{color:#738079;font-size:12px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="admin.html">← Donor Admin</a></header><main class="page"><section class="login" id="login"><div class="eyebrow">🛡️ Secure Admin</div><h1>সহায়তার আবেদন Review</h1><p>Financial, Food এবং Medical আবেদন যাচাই করে campaign হিসেবে প্রকাশ করুন।</p><input id="password" type="password" placeholder="Admin password"><button class="btn" id="loginBtn">Review Panel খুলুন</button><div id="loginErr" class="error"></div></section><section id="app" style="display:none"><div class="top"><div><div class="eyebrow">📋 Help Requests</div><h1>আবেদন যাচাই ও প্রকাশ</h1></div><button class="btn danger" id="logout">Logout</button></div><div class="panel" id="list"></div><p class="muted">Approve করার সময় optional image URL ও YouTube URL দিলে approved campaign-এ সেগুলো দেখা যাবে।</p></section></main><script>const $=id=>document.getElementById(id);let password='';let requests=[];function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}async function api(path='',options={}){const r=await fetch('/api/admin-requests'+path,{...options,headers:{'Content-Type':'application/json','x-admin-password':password,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){const xs=requests;$("list").innerHTML=xs.length?xs.map(x=>`<article class="item"><span class="pill">${esc(x.service)}</span> <span class="status ${esc(x.status)}">${esc(x.status)}</span><h3>${esc(x.name)}</h3><div class="meta">📱 ${esc(x.phone)}<br>📍 ${esc([x.division,x.district,x.upazila,x.union_name].filter(Boolean).join(' / '))}<br>🕒 ${esc(x.created_at||'')}</div><div class="details">${esc(x.details)}</div>${x.status==='pending'?`<div class="actions"><button class="btn" onclick="toggleApprove('${x.id}')">Approve & Publish</button> <button class="btn danger" onclick="removeRequest('${x.id}')">Reject / Delete</button><div class="approvebox" id="box-${x.id}"><label>Campaign title<input id="title-${x.id}" placeholder="যেমন: মানিকগঞ্জের রাহিমের চিকিৎসা সহায়তা"></label><label>ছবির URL <input id="image-${x.id}" placeholder="https://..."></label><label>YouTube video URL (optional)<input id="youtube-${x.id}" placeholder="https://youtu.be/... বা https://www.youtube.com/watch?v=..."></label><label>প্রয়োজনীয় অর্থ (optional)<input id="amount-${x.id}" type="number" min="0" placeholder="টাকা"></label><button class="btn" onclick="approve('${x.id}')">✅ Publish Campaign</button></div></div>`:`<div class="muted" style="margin-top:12px">এই আবেদন campaign হিসেবে approved হয়েছে।</div>`}</article>`).join(''):'<div class="item">কোনো আবেদন নেই।</div>'}async function load(){const d=await api();requests=d.requests||[];render()}function toggleApprove(id){$("box-"+id).classList.toggle('show')}async function approve(id){try{await api('',{method:'POST',body:JSON.stringify({id,action:'approve',title:$("title-"+id).value,image_url:$("image-"+id).value,youtube_url:$("youtube-"+id).value,amount:$("amount-"+id).value})});await load()}catch(e){alert(e.message)}}async function removeRequest(id){if(!confirm('এই আবেদনটি Reject/Delete করবেন?'))return;try{await api('',{method:'DELETE',body:JSON.stringify({id})});await load()}catch(e){alert(e.message)}}$("loginBtn").onclick=async()=>{password=$("password").value;if(!password){$("loginErr").textContent='Password দিন।';$("loginErr").classList.add('show');return}$("loginErr").classList.remove('show');try{await load();$("login").style.display='none';$("app").style.display='block'}catch(e){password='';$("loginErr").textContent=e.message;$("loginErr").classList.add('show')}};$("logout").onclick=()=>{password='';$("app").style.display='none';$("login").style.display='block';$("password").value=''};</script></body></html>
