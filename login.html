<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — HelpBD</title><link rel="stylesheet" href="style.css"><style>.auth{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:40px 5%;background:linear-gradient(135deg,#f0faf5,#fbfdfb)}.auth-card{width:min(460px,100%);background:#fff;border:1px solid #e0ebe5;border-radius:24px;padding:38px;box-shadow:0 25px 70px #174d3612}.auth-card h1{font-size:32px;margin:8px 0}.auth-card p{color:#718079;line-height:1.6}.phone{display:flex;gap:8px}.prefix{padding:14px 12px;background:#f1f7f4;border:1px solid #dbe6e0;border-radius:10px;font-weight:700}.phone input{margin:0}.auth-btn{width:100%;margin-top:8px;border:0;cursor:pointer;font:700 15px 'Hind Siliguri'}.otp{display:none}.otp.show{display:block}.otp input{letter-spacing:7px;text-align:center;font-size:22px}.note{font-size:13px;margin-top:15px}.switch{display:block;text-align:center;margin-top:20px;color:#0c955a;font-weight:700}@media(max-width:500px){.auth-card{padding:27px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a href="index.html" class="navbtn">← Home</a></header><main class="auth"><section class="auth-card"><div class="eyebrow">🔐 নিরাপদ প্রবেশ</div><h1>HelpBD-তে লগইন করুন</h1><p>সাহায্য নিতে বা সাহায্য করতে আপনার মোবাইল নম্বর দিয়ে লগইন করতে হবে।</p><div id="phoneBox"><label>মোবাইল নম্বর<div class="phone"><span class="prefix">+880</span><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="1XXXXXXXXX"></div></label><button class="primary auth-btn" onclick="requestOTP()">OTP পাঠান →</button></div><div id="otpBox" class="otp"><label>SMS-এ পাওয়া OTP<input id="otp" inputmode="numeric" maxlength="6" placeholder="••••••"></label><button class="primary auth-btn" onclick="verifyOTP()">Verify & Continue →</button><p class="note">Demo mode: বর্তমানে যেকোনো ৬ সংখ্যার OTP গ্রহণ করা হবে। Real SMS verification পরে যুক্ত হবে।</p></div><a class="switch" href="index.html">← ফিরে যান</a></section></main><script>function requestOTP(){const p=document.getElementById('phone').value.replace(/\D/g,'');if(p.length!==10||!p.startsWith('1')){alert('সঠিক বাংলাদেশি মোবাইল নম্বর দিন। যেমন 1712345678');return}document.getElementById('phoneBox').style.display='none';document.getElementById('otpBox').classList.add('show')}function verifyOTP(){const o=document.getElementById('otp').value.trim();if(!/^\d{6}$/.test(o)){alert('৬ সংখ্যার OTP দিন।');return}localStorage.setItem('helpbd_logged_in','1');const next=new URLSearchParams(location.search).get('next')||'index.html';location.href=next}</script></body></html>
