<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelpBD Admin — জরুরি সহায়তা</title><link rel="stylesheet" href="style.css"><style>body{background:#f3f7f5}.page{max-width:1150px;margin:auto;padding:35px 5%}.login,.panel{background:#fff;border:1px solid #e1ebe5;border-radius:18px}.login{max-width:500px;margin:70px auto;padding:28px}.login input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 14px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}.btn{display:inline-block;border:0;background:#173a2f;color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer}.refresh{background:#129d63}.danger{background:#fdecee;color:#b23c49}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #e8eeeb}.actions{display:flex;gap:8px}.item{padding:22px;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.meta{color:#697771;font-size:13px;line-height:1.9}.pill{display:inline-block;background:#fff4da;color:#a36a00;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.details{white-space:pre-wrap;background:#f7faf8;border:1px solid #e5eeea;border-radius:12px;padding:14px;margin-top:12px;line-height:1.7}.error{display:none;background:#fdecee;color:#b23c49;padding:12px;border-radius:10px;margin-top:12px}.show{display:block}.empty{padding:45px;text-align:center;color:#7c8984}@media(max-width:700px){.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}}</style></head><body><header class="nav"><a class="brand" href="admin-home.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="admin-home.html">← Admin Home</a></header><main class="page"><section class="login" id="login"><div class="eyebrow">🛡️ Secure Admin</div><h1>জরুরি সহায়তা Admin</h1><p>জরুরি আবেদনগুলো দেখুন।</p><input id="password" type="password" placeholder="Admin password"><button class="btn" id="loginBtn">Panel খুলুন</button><div id="err" class="error"></div></section><section id="app" style="display:none"><div class="toolbar"><div><div class="eyebrow">🚨 Emergency</div><h1>জরুরি সহায়তার আবেদন</h1></div><div class="actions"><button class="btn refresh" id="refresh">🔄 Refresh</button><button class="btn danger" id="logout">Logout</button></div></div><div class="panel" id="list"></div><p style="color:#738079;font-size:12px;line-height:1.7;margin-top:14px">আবেদনগুলো এখন shared database থেকে আসে, তাই public website/app থেকে পাঠানো আবেদন অন্য device-এর Admin panel-এও দেখা যাবে।</p></section></main><script>const $=id=>document.getElementById(id);const SESSION_KEY='helpbd_admin_password';let password=localStorage.getItem(SESSION_KEY)||'';function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}async function render(){if(!password)return;const list=$('list');list.innerHTML='<div class="empty">আবেদনগুলো লোড হচ্ছে...</div>';try{const res=await fetch('/api/admin-requests',{headers:{'x-admin-password':password,Accept:'application/json'},cache:'no-store'});const out=await res.json().catch(()=>({}));if(!res.ok)throw new Error(out.error||'Admin authentication failed');const rows=Array.isArray(out.requests)?out.requests.filter(r=>r.service==='জরুরি সহায়তা'):[];list.innerHTML=rows.length?rows.map(r=>{const id=esc(r.id);return `<article class="item"><span class="pill">${esc(r.urgency||'জরুরি')}</span><h3>${esc(r.name)}</h3><div class="meta">📱 ${esc(r.phone)}<br>🚨 ${esc(r.type||'')}<br>📍 ${esc([r.division,r.district,r.upazila,r.union_name||r.union].filter(Boolean).join(' / '))}<br>🕒 ${esc(r.created_at||r.createdAt||'')}<br>📌 Status: <b>${esc(r.status||'pending')}</b></div><div class="details">${esc(r.details)}</div><div class="actions" style="margin-top:12px"><button class="btn danger" data-delete="${id}">🗑️ Delete</button></div></article>`}).join(''):'<div class="empty">কোনো জরুরি আবেদন পাওয়া যায়নি।</div>'}catch(err){if(String(err.message).toLowerCase().includes('authentication')){localStorage.removeItem(SESSION_KEY);password='';$('app').style.display='none';$('login').style.display='block';$('password').value='';$('err').textContent='❌ Admin password সঠিক নয়।';$('err').classList.add('show')}else{list.innerHTML='<div class="empty">❌ আবেদন লোড করা যায়নি। Refresh চাপুন।</div>'}}}window.removeReq=async id=>{if(!confirm('এই জরুরি আবেদনটি Delete করবেন?'))return;try{const res=await fetch('/api/admin-requests',{method:'DELETE',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({id})});if(!res.ok)throw new Error('delete failed');render()}catch{alert('Delete করা যায়নি।')}};$('list').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(b)removeReq(b.dataset.delete)});function open(){if(!password)return false;$('login').style.display='none';$('app').style.display='block';render();return true}$('loginBtn').onclick=()=>{password=$('password').value.trim();$('err').classList.remove('show');if(!password){$('err').textContent='Admin password দিন।';$('err').classList.add('show');return}localStorage.setItem(SESSION_KEY,password);open()};$('refresh').onclick=render;$('logout').onclick=()=>{localStorage.removeItem(SESSION_KEY);password='';$('app').style.display='none';$('login').style.display='block';$('password').value=''};open();</script></body></html>
