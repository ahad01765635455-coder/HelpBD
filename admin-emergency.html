<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelpBD Admin — জরুরি সহায়তা</title><link rel="stylesheet" href="style.css"><style>body{background:#f3f7f5}.page{max-width:1150px;margin:auto;padding:35px 5%}.login,.panel{background:#fff;border:1px solid #e1ebe5;border-radius:18px}.login{max-width:500px;margin:70px auto;padding:28px}.login input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0 14px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}.btn{display:inline-block;border:0;background:#173a2f;color:#fff;padding:11px 15px;border-radius:10px;font-weight:700;text-decoration:none;cursor:pointer}.refresh{background:#129d63}.danger{background:#fdecee;color:#b23c49}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #e8eeeb}.actions{display:flex;gap:8px}.item{padding:22px;border-bottom:1px solid #edf1ef}.item:last-child{border:0}.meta{color:#697771;font-size:13px;line-height:1.9}.pill{display:inline-block;background:#fff4da;color:#a36a00;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.details{white-space:pre-wrap;background:#f7faf8;border:1px solid #e5eeea;border-radius:12px;padding:14px;margin-top:12px;line-height:1.7}.error{display:none;background:#fdecee;color:#b23c49;padding:12px;border-radius:10px;margin-top:12px}.show{display:block}.empty{padding:45px;text-align:center;color:#7c8984}@media(max-width:700px){.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}}</style></head><body><header class="nav"><a class="brand" href="admin-home.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="admin-home.html">← Admin Home</a></header><main class="page"><section class="login" id="login"><div class="eyebrow">🛡️ Secure Admin</div><h1>জরুরি সহায়তা Admin</h1><p>জরুরি আবেদনগুলো দেখুন, status update করুন অথবা delete করুন।</p><input id="password" type="password" placeholder="Admin password"><button class="btn" id="loginBtn">Panel খুলুন</button><div id="err" class="error"></div></section><section id="app" style="display:none"><div class="toolbar"><div><div class="eyebrow">🚨 Emergency</div><h1>জরুরি সহায়তার আবেদন</h1></div><div class="actions"><button class="btn refresh" id="refresh">🔄 Refresh</button><button class="btn danger" id="logout">Logout</button></div></div><div class="panel" id="list"></div><p style="color:#738079;font-size:12px;line-height:1.7;margin-top:14px">নোট: বর্তমান public emergency form আবেদনগুলো browser localStorage-এ রাখছে। তাই একই browser/device ছাড়া অন্য device থেকে এই data পাওয়া যাবে না।</p></section></main><script>const $=id=>document.getElementById(id);const SESSION_KEY='helpbd_admin_password';const REQUEST_KEY='helpbd_requests';let password=localStorage.getItem(SESSION_KEY)||'';function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function getData(){try{const x=JSON.parse(localStorage.getItem(REQUEST_KEY)||'[]');return Array.isArray(x)?x.filter(r=>r.service==='জরুরি সহায়তা'):[]}catch{return[]}}function render(){const rows=getData();$('list').innerHTML=rows.length?rows.map(r=>`<article class="item"><span class="pill">${esc(r.urgency||'জরুরি')}</span><h3>${esc(r.name)}</h3><div class="meta">📱 ${esc(r.phone)}<br>🚨 ${esc(r.type||'')}<br>📍 ${esc([r.division,r.district,r.upazila,r.union].filter(Boolean).join(' / '))}<br>🕒 ${esc(r.createdAt||'')}<br>📌 Status: <b>${esc(r.status||'pending')}</b></div><div class="details">${esc(r.details)}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="markDone(${r.id})">✅ সমাধান হয়েছে</button><button class="btn danger" onclick="removeReq(${r.id})">🗑️ Delete</button></div></article>`).join(''):'<div class="empty">কোনো জরুরি আবেদন পাওয়া যায়নি।</div>'}function open(){password=localStorage.getItem(SESSION_KEY)||'';if(!password)return false;$('login').style.display='none';$('app').style.display='block';render();return true}function save(rows){localStorage.setItem(REQUEST_KEY,JSON.stringify(rows))}window.markDone=id=>{try{const all=JSON.parse(localStorage.getItem(REQUEST_KEY)||'[]');save(all.map(r=>r.id===id?{...r,status:'resolved'}:r));render()}catch{}};window.removeReq=id=>{if(!confirm('এই জরুরি আবেদনটি Delete করবেন?'))return;try{const all=JSON.parse(localStorage.getItem(REQUEST_KEY)||'[]');save(all.filter(r=>r.id!==id));render()}catch{}};$('loginBtn').onclick=()=>{password=$('password').value.trim();if(!password){$('err').textContent='Admin password দিন।';$('err').classList.add('show');return}localStorage.setItem(SESSION_KEY,password);open()};$('refresh').onclick=render;$('logout').onclick=()=>{localStorage.removeItem(SESSION_KEY);password='';$('app').style.display='none';$('login').style.display='block';$('password').value=''};open();</script></body></html>
