<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আর্থিক সহায়তা — HelpBD</title><link rel="stylesheet" href="style.css"><style>body{background:#f4f8f6}.page{max-width:1100px;margin:auto;padding:42px 5%}.hero,.card{border-radius:22px}.hero{background:#102d24;color:#fff;padding:34px;margin-bottom:22px}.hero h1{font-size:40px;margin:8px 0}.heroimg{width:100%;height:250px;object-fit:cover;border-radius:18px;margin-top:18px}.card{background:#fff;border:1px solid #e1ebe5;padding:28px;margin-bottom:22px;box-shadow:0 12px 38px #174d3609}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:600;display:block;margin-bottom:14px}input,select,textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #dbe6e0;border-radius:10px;font:inherit}textarea{min-height:120px}.btn{border:0;background:#129d63;color:#fff;padding:14px 20px;border-radius:11px;font-weight:700;cursor:pointer}.ok,.err{display:none;margin-top:14px;padding:13px;border-radius:10px}.ok{background:#e8f8f0;color:#087f4d}.err{background:#fdecee;color:#b23c49}.show{display:block}.campaigns{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.campaign-card{background:#fff;border:1px solid #e1ebe5;border-radius:18px;overflow:hidden;box-shadow:0 10px 25px #174d3608}.campaign-card>img{width:100%;height:210px;object-fit:cover}.campaign-body{padding:20px}.campaign-body h3{font-size:22px;margin:10px 0}.campaign-body p{color:#66756e;line-height:1.65}.service-pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e8f8f0;color:#087f4d;font-size:12px;font-weight:700}.details-text{white-space:pre-wrap}.help-btn{display:inline-block;margin-top:12px;background:#173a2f;color:#fff;text-decoration:none;padding:11px 14px;border-radius:10px;font-weight:700}.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:10px}.empty{padding:30px;border:1px dashed #cad8d0;border-radius:12px;color:#78857f;text-align:center}@media(max-width:700px){.row,.campaigns{grid-template-columns:1fr}.hero h1{font-size:32px}}</style></head><body><header class="nav"><a class="brand" href="index.html"><span class="logo">❤</span><span>Help<span>BD</span></span></a><a class="navbtn" href="index.html">← Home</a></header><main class="page"><section class="hero"><div class="eyebrow">💝 আর্থিক সহায়তা</div><h1>প্রয়োজনে পাশে দাঁড়ান</h1><p>আর্থিক সহায়তার আবেদন Admin যাচাই করবেন। অনুমোদিত হলে ছবি, বিস্তারিত তথ্য এবং প্রয়োজনে YouTube ভিডিওসহ campaign এখানে প্রকাশ হবে।</p><img class="heroimg" src="https://b4250386.smushcdn.com/4250386/wp-content/uploads/2025/10/Bn1.jpg?lossy=2&strip=1&webp=1" alt="বাংলাদেশে আর্থিক সহায়তা"></section><section class="card"><h2>আর্থিক সহায়তার আবেদন</h2><form id="form"><div class="row"><label>আবেদনকারীর নাম<input id="name" required></label><label>মোবাইল নম্বর<input id="phone" required maxlength="11" inputmode="numeric" placeholder="017XXXXXXXX"></label></div><div class="row"><label>সহায়তার ধরন<select id="type" required><option value="">নির্বাচন করুন</option><option>চিকিৎসা</option><option>শিক্ষা</option><option>খাবার</option><option>বাসস্থান</option><option>জরুরি প্রয়োজন</option><option>অন্যান্য</option></select></label><label>প্রয়োজনীয় অর্থ<input id="amount" type="number" min="1" placeholder="টাকা"></label></div><div class="row"><label>বিভাগ<select id="division" required></select></label><label>জেলা<select id="district" required disabled></select></label></div><div class="row"><label>উপজেলা<select id="upazila" required disabled></select></label><label>ইউনিয়ন<select id="union" required disabled></select></label></div><label>বিস্তারিত<textarea id="details" required placeholder="কেন সাহায্য প্রয়োজন তা বিস্তারিত লিখুন..."></textarea></label><button class="btn" type="submit">Admin-এর কাছে আবেদন পাঠান →</button><div id="ok" class="ok"></div><div id="err" class="err"></div></form></section><section class="card"><h2>✅ অনুমোদিত সহায়তার campaign</h2><div id="campaigns" class="campaigns"></div></section></main><script src="locations.js"></script><script src="campaigns.js"></script><script>const $=id=>document.getElementById(id);loadBDLocations();$('form').onsubmit=async e=>{e.preventDefault();$('ok').classList.remove('show');$('err').classList.remove('show');const l={division:$('division').selectedOptions[0]?.text||'',district:$('district').selectedOptions[0]?.text||'',upazila:$('upazila').selectedOptions[0]?.text||'',union_name:$('union').selectedOptions[0]?.text||''};if(!/^01\d{9}$/.test($('phone').value.trim()))return($('err').textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।',$('err').classList.add('show'));try{const r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:'আর্থিক সহায়তা',name:$('name').value.trim(),phone:$('phone').value.trim(),details:`সহায়তার ধরন: ${$('type').value}\nপ্রয়োজনীয় অর্থ: ${$('amount').value||'উল্লেখ করা হয়নি'} টাকা\n${$('details').value.trim()}`,...l,amount:$('amount').value||null})});const d=await r.json();if(!r.ok)throw Error(d.error||'আবেদন পাঠানো যায়নি');$('ok').textContent='✅ আবেদনটি Admin-এর কাছে Pending হিসেবে পাঠানো হয়েছে।';$('ok').classList.add('show');e.target.reset()}catch(err){$('err').textContent='❌ '+err.message;$('err').classList.add('show')}};loadApprovedCampaigns();</script></body></html>
