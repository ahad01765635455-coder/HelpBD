name: Build HelpBD Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-admin-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle project
        working-directory: admin-app
        run: gradle tasks --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle -p admin-app :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HelpBD-Admin-debug-apk
          path: admin-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
